<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0c14">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/life.css">
<title>ライフカウンター | MTGデッキ開発室</title>
</head>
<body class="life-page">
<main class="life-app">
  <section id="lifeModeSelect" class="life-mode-select" aria-labelledby="lifeModeTitle">
    <div class="life-mode-panel">
      <img class="life-mode-kanade" src="kanade_normal.png" alt="宙星かなで">
      <h1 id="lifeModeTitle">初期ライフを選んでね！</h1>
      <div class="life-mode-buttons">
        <button class="life-mode-button" type="button" data-life-mode="20">
          <strong>20点</strong>
          <span>通常対戦</span>
        </button>
        <button class="life-mode-button life-mode-button--commander" type="button" data-life-mode="40">
          <strong>40点・統率者戦</strong>
          <span>統率者ダメージ3枠</span>
        </button>
      </div>
      <a class="life-mode-home" href="index.html">ホームへ戻る</a>
    </div>
  </section>

  <section id="lifeCounter" class="life-counter" aria-label="対戦用ライフカウンター" hidden>
    <header class="life-topbar">
      <a class="life-home-link" href="index.html">‹ ホームへ戻る</a>
      <span id="lifeModeLabel" class="life-mode-label"></span>
    </header>

    <div class="life-guide">
      <button id="lifeKanadeButton" class="life-kanade-button" type="button" aria-label="かなでのセリフを変える">
        <img src="kanade_normal.png" alt="宙星かなで">
      </button>
      <div class="life-guide-copy">
        <div class="life-guide-name">💜かなで</div>
        <p id="lifeKanadeMessage">対戦開始！ 今日も楽しんでいこうね♪</p>
      </div>
    </div>

    <section class="life-main-counter" aria-label="ライフ">
      <div class="life-initial">初期ライフ：<span id="initialLife">20</span></div>
      <output id="lifeTotal" class="life-total" aria-live="polite">20</output>
      <div class="life-controls">
        <button class="life-change life-change--minus" type="button" data-life-change="-1" aria-label="ライフを1減らす">−1</button>
        <button class="life-change life-change--plus" type="button" data-life-change="1" aria-label="ライフを1増やす">＋1</button>
      </div>
    </section>

    <section id="commanderSection" class="commander-section" aria-labelledby="commanderTitle" hidden>
      <h2 id="commanderTitle">統率者ダメージ</h2>
      <div class="commander-list">
        <div class="commander-row" data-commander="a">
          <div class="commander-opponent">相手A <span class="commander-danger-label">21点到達</span></div>
          <output class="commander-total" aria-live="polite">0</output>
          <div class="commander-controls">
            <button type="button" data-commander-change="-1" aria-label="相手Aからの統率者ダメージを1減らす">−1</button>
            <button type="button" data-commander-change="1" aria-label="相手Aからの統率者ダメージを1増やす">＋1</button>
          </div>
        </div>
        <div class="commander-row" data-commander="b">
          <div class="commander-opponent">相手B <span class="commander-danger-label">21点到達</span></div>
          <output class="commander-total" aria-live="polite">0</output>
          <div class="commander-controls">
            <button type="button" data-commander-change="-1" aria-label="相手Bからの統率者ダメージを1減らす">−1</button>
            <button type="button" data-commander-change="1" aria-label="相手Bからの統率者ダメージを1増やす">＋1</button>
          </div>
        </div>
        <div class="commander-row" data-commander="c">
          <div class="commander-opponent">相手C <span class="commander-danger-label">21点到達</span></div>
          <output class="commander-total" aria-live="polite">0</output>
          <div class="commander-controls">
            <button type="button" data-commander-change="-1" aria-label="相手Cからの統率者ダメージを1減らす">−1</button>
            <button type="button" data-commander-change="1" aria-label="相手Cからの統率者ダメージを1増やす">＋1</button>
          </div>
        </div>
      </div>
    </section>

    <button id="lifeResetButton" class="life-reset" type="button">リセット</button>
  </section>
</main>

<script src="js/life.js" defer></script>
</body>
</html>
