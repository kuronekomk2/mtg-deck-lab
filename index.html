<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0c14">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/common.css">
<title>MTGデッキ開発室</title>
</head>
<body>
<div class="app home-app">
  <header class="home-welcome">
    <img class="manager-logo" src="kanade_mtg_manager_logo.jpg" alt="宙星かなでのMTGマネージャー">

    <section class="welcome-card kanade-room" aria-label="かなでの部屋">
      <button class="hero-costume-button" type="button" aria-label="ランダム着替え（仮配置）"><img src="icon_kisekae.png" alt=""></button>
      <div class="kanade-room-stage">
        <div class="welcome-kanade-wrap">
        <img id="welcomeKanade" class="welcome-kanade" src="kanade_normal.png" alt="宙星かなで">
        </div>
      </div>
      <div class="welcome-talk">
        <div class="welcome-name">💜 宙星かなで</div>
        <div class="welcome-bubble">
          <p id="welcomeMessage">おかえり、くーちゃん！ 今日も一緒にデッキを育てようね！</p>
        </div>
      </div>
      <div class="kanade-room-actions hero-action-buttons" aria-label="かなでの部屋メニュー（仮配置）">
        <button id="heroWelcomeButton" class="hero-action-button" type="button" aria-label="かなでのひとことを変える"><img src="icon_hitokoto.png" alt=""></button>
        <button id="dailyGuidanceButton" class="hero-action-button" type="button" aria-label="今日の導きを開く" aria-haspopup="dialog"><img src="icon_kyouno1mai.png" alt=""></button>
        <button class="hero-action-button" type="button" aria-label="ライフカウンター（仮配置）"><img src="icon_life.png" alt=""></button>
        <button class="hero-action-button" type="button" aria-label="対戦記録（仮配置）"><img src="icon_taisen.png" alt=""></button>
      </div>
    </section>
  </header>

  <section class="home-section">
    <div class="deck-lab-title-wrap">
      <img class="deck-lab-title" src="mtg_deck_lab_title.png" alt="MTGデッキ開発室">
    </div>

    <div class="home-section-heading">
      <div>
        <div class="home-section-kicker">DECK LIBRARY</div>
        <h1 id="appTitle">デッキを選ぶ</h1>
      </div>
      <span class="deck-count" id="deckCount">0 decks</span>
    </div>

    <div id="loading" class="panel home-loading">デッキ一覧を読み込んでいます…</div>
    <div id="error" class="error" hidden></div>
    <main class="deck-grid" id="deckGrid" hidden></main>
  </section>

  <footer class="home-footer" aria-label="アプリ情報">
    <div class="footer-version" id="appVersion">Ver.4.1</div>
    <div class="footer-made">Made with ❤️ by</div>
    <div class="footer-name">宙星かなで</div>
  </footer>
</div>

<div id="dailyGuidanceModal" class="guidance-modal" hidden>
  <div class="guidance-modal__backdrop" data-guidance-close></div>
  <section class="guidance-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="dailyGuidanceTitle">
    <button class="guidance-modal__x" type="button" aria-label="今日の導きを閉じる" data-guidance-close>×</button>
    <div class="guidance-modal__eyebrow">DAILY GUIDANCE</div>
    <h2 id="dailyGuidanceTitle" class="guidance-modal__title">今日の導き</h2>

    <div class="guidance-card">
      <img class="guidance-card__image" src="growth_mana_card.svg" alt="芽吹く若葉とマナを描いた「成長のマナ」のカード">
      <div class="guidance-card__text">
        <div class="guidance-card__block">
          <span>今日のテーマ</span>
          <strong>積み重ね</strong>
        </div>
        <div class="guidance-card__block">
          <span>かなでの占い結果</span>
          <strong>焦らず一歩ずつ</strong>
        </div>
      </div>
    </div>

    <div class="guidance-comment">
      <div class="guidance-comment__name">💜かなで</div>
      <p>今日は焦らなくても大丈夫！<br>昨日より少しだけ前へ進めたら十分だよ♪</p>
    </div>
    <button class="guidance-modal__close" type="button" data-guidance-close>閉じる</button>
  </section>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
